<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロルカナ コレクション管理</title><style>

:root{--bg:#0b1020;--panel:#131a2d;--panel2:#172037;--text:#f5f7fb;--muted:#9aa7bd;--gold:#ffd36e;--ok:#86efac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2750,#0b1020 58%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Yu Gothic',Meiryo,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);padding:16px 20px}.wrap{max-width:1280px;margin:0 auto}h1{margin:0 0 10px;font-size:24px}.summary{display:flex;gap:10px;flex-wrap:wrap}.pill{background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:13px}.pill b{color:var(--text)}.controls{display:grid;grid-template-columns:1.2fr repeat(4,auto);gap:10px;align-items:center;margin-top:14px}input,select,button{border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#0d1427;color:var(--text);padding:10px 12px;font-size:14px}button{cursor:pointer;background:#1b2a4e}button:hover{filter:brightness(1.15)}.tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.tab{border-radius:999px}.tab.active{background:linear-gradient(135deg,#2dd4bf,#60a5fa);color:#05111f;font-weight:700}main{padding:22px 20px 70px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.10);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.24)}.card.missing{opacity:.42;filter:grayscale(1)}.imgbox{background:#0a0f1e;aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;overflow:hidden}.imgbox img{width:100%;height:100%;object-fit:contain;display:block}.noimg{color:var(--muted);padding:20px;text-align:center}.info{padding:12px}.topline{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;color:var(--muted);font-size:12px}.badge{color:#07111d;background:var(--gold);border-radius:999px;padding:3px 8px;font-weight:700}.name{font-weight:800;line-height:1.35;min-height:42px}.set{color:var(--muted);font-size:12px;margin:7px 0 10px;line-height:1.35;min-height:34px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}.step{display:flex;gap:6px;align-items:center;flex-shrink:0}.step button{width:32px;height:32px;padding:0;border-radius:9px;font-size:16px;line-height:1}.owned{width:72px;min-width:72px;text-align:center;font-weight:700;padding:8px 6px;font-size:16px}.price{width:118px;text-align:right}.value{font-size:12px;color:var(--ok);text-align:right;margin-top:8px}.purchaseNote{font-size:12px;color:var(--muted);text-align:right;margin-top:8px}.purchaseNote a{color:#9fd3ff;text-decoration:none}.purchaseNote a:hover{text-decoration:underline}.empty{text-align:center;color:var(--muted);padding:70px 0}.footer{position:fixed;right:18px;bottom:18px;z-index:12}.footer button{box-shadow:0 8px 22px rgba(0,0,0,.25)}@media(max-width:720px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}h1{font-size:20px}.name{min-height:54px;font-size:14px}.row{align-items:flex-start;flex-direction:column}.step{width:100%;justify-content:space-between}.owned{flex:1;width:auto}.price{width:100%}}

.help{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}.toolbtn{background:#24385f}.imgSource{font-size:11px;color:#7d8ca5;text-align:center;margin-top:6px}.imageTools{display:flex;gap:6px;margin-top:8px}.imageTools input{flex:1;min-width:0;padding:7px 8px;font-size:12px;border-radius:9px}.imageTools button{width:74px;padding:7px 6px;font-size:12px;border-radius:9px}.clearImg{background:#2b1f35}
</style></head><body><header><div class="wrap"><h1>ロルカナ コレクション管理</h1><div class="summary" id="summary"></div><div class="controls"><input id="q" placeholder="カード名・セット名で検索"><select id="ownedFilter"><option value="all">全部</option><option value="owned">所持のみ</option><option value="missing">未所持のみ</option></select><select id="sort"><option value="number">カード番号順</option><option value="priceDesc">購入価格高い順</option><option value="ownedDesc">所持枚数多い順</option></select><button id="exportBtn">保存データ書出</button><button id="importBtn">読込</button></div><div class="tabs"><button class="tab active" data-cat="all">全部</button><button class="tab" data-cat="エンチャンテッド">エンチャンテッド</button><button class="tab" data-cat="アイコニック">アイコニック</button><button class="tab" data-cat="プロモ">プロモ</button></div><div class="help">画像URL欄に画像URLを貼って「画像保存」で手動追加できます。プロモの一括取得は <b>update_images.bat</b>。</div></div></header><main><div class="wrap"><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>該当カードがありません</div></div></main><div class="footer"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 上へ</button></div><input type="file" id="file" accept="application/json" hidden>
<script src="data.js"></script><script src="promo_images.js"></script><script>
const KEY='lorcana_collection_v14';let state=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('lorcana_collection_v13')||localStorage.getItem('lorcana_collection_v12')||'{}');let activeCat='all';
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function getItem(d){const s=state[d.id]||{};return {...d,owned:s.owned??d.owned??0,price:s.price??d.price??0,imageUrl:s.imageUrl??''}}function patch(id,p){state[id]={...(state[id]||{}),...p};localStorage.setItem(KEY,JSON.stringify(state));render()}
function displayImage(d){ if(d.imageUrl) return d.imageUrl; if(d.category==='プロモ' && typeof PROMO_IMAGES!=='undefined' && PROMO_IMAGES[d.id]) return PROMO_IMAGES[d.id]; return d.image||''; }
function setImageUrl(id){const el=document.getElementById('imgurl_'+CSS.escape(id));const v=(el?.value||'').trim();if(!v){alert('画像URLを入れてください');return}if(!/^https?:\/\//i.test(v) && !/^images\//i.test(v)){alert('https:// から始まる画像URL、または images/ から始まるパスを入れてください');return}patch(id,{imageUrl:v})}
function clearImageUrl(id){patch(id,{imageUrl:''})}
function render(){let items=BASE_DATA.map(getItem);const q=document.getElementById('q').value.trim().toLowerCase();const of=document.getElementById('ownedFilter').value;const sort=document.getElementById('sort').value;if(activeCat!=='all')items=items.filter(x=>x.category===activeCat);if(q)items=items.filter(x=>(x.name+' '+x.set+' '+x.code+' '+x.number).toLowerCase().includes(q));if(of==='owned')items=items.filter(x=>Number(x.owned)>0);if(of==='missing')items=items.filter(x=>Number(x.owned)<=0);items.sort((a,b)=>sort==='priceDesc'?Number(b.price)-Number(a.price):sort==='ownedDesc'?Number(b.owned)-Number(a.owned):(Number(a.sortNumber??a.number)-Number(b.sortNumber??b.number)||String(a.code).localeCompare(String(b.code),'ja')));const total=BASE_DATA.length,ownedKinds=BASE_DATA.map(getItem).filter(x=>Number(x.owned)>0).length,ownedCards=BASE_DATA.map(getItem).reduce((s,x)=>s+Number(x.owned||0),0),value=BASE_DATA.map(getItem).reduce((s,x)=>s+Number(x.owned||0)*Number(x.price||0),0);document.getElementById('summary').innerHTML=`<span class="pill">登録 <b>${total}</b> 種</span><span class="pill">所持種類 <b>${ownedKinds}</b> 種</span><span class="pill">所持枚数 <b>${ownedCards}</b> 枚</span><span class="pill">購入額 <b>${yen(value)}</b></span>`;document.getElementById('empty').hidden=items.length>0;document.getElementById('grid').innerHTML=items.map(d=>{const img=displayImage(d); const local=(d.category==='プロモ' && typeof PROMO_IMAGES!=='undefined' && PROMO_IMAGES[d.id]); return `<article class="card ${Number(d.owned)>0?'':'missing'}"><div class="imgbox">${img?`<img src="${esc(img)}" alt="${esc(d.name)}" onerror="this.outerHTML='<div class=&quot;noimg&quot;>画像なし<br>${d.sourceUrl?'<a style=&quot;color:#9fd3ff&quot; href=&quot;'+esc(d.sourceUrl)+'&quot; target=&quot;_blank&quot;>ロルハッピーで確認</a>':''}</div>'">`:`<div class="noimg">画像なし${d.sourceUrl?'<br><a style="color:#9fd3ff" href="'+esc(d.sourceUrl)+'" target="_blank">ロルハッピーで確認</a>':''}</div>`}</div><div class="info"><div class="topline"><span>${esc(d.code)}</span><span class="badge">${esc(d.category)}</span></div><div class="name">${esc(d.name)}</div><div class="set">${esc(d.set||'')}</div><div class="row"><div class="step"><button onclick="patch('${esc(d.id)}',{owned:Math.max(0,Number(getItem(BASE_DATA.find(x=>x.id==='${esc(d.id)}')).owned)-1)})">−</button><input class="owned" type="number" min="0" value="${Number(d.owned)||0}" onchange="patch('${esc(d.id)}',{owned:Number(this.value)||0})"><button onclick="patch('${esc(d.id)}',{owned:Number(getItem(BASE_DATA.find(x=>x.id==='${esc(d.id)}')).owned)+1})">＋</button></div><input class="price" type="number" min="0" value="${Number(d.price)||0}" onchange="patch('${esc(d.id)}',{price:Number(this.value)||0})" title="購入価格"></div><div class="value">購入額：${yen(Number(d.price||0)*Number(d.owned||0))}</div><div class="imageTools"><input id="imgurl_${esc(d.id)}" placeholder="画像URLを貼る" value="${esc(d.imageUrl||'')}"><button onclick="setImageUrl('${esc(d.id)}')">画像保存</button></div>${d.imageUrl?'<div class="imgSource">画像：手動URL</div><div class="imageTools"><button class="clearImg" onclick="clearImageUrl(\'${esc(d.id)}\')">手動画像を消す</button></div>':(local?'<div class="imgSource">画像：ロルハッピー取得済み</div>':'')}</div></article>`}).join('')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;render()});['q','ownedFilter','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lorcana_collection_save.json';a.click()};document.getElementById('importBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state=JSON.parse(r.result);localStorage.setItem(KEY,JSON.stringify(state));render()};r.readAsText(f)};render();
</script></body></html>
