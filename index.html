<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ロルカナ 高レアリティバインダー</title>
<style>
:root{--bg:#080b16;--bg2:#17112a;--panel:#141a2e;--line:#2b3452;--text:#f6f7fc;--muted:#aab2d3;--gold:#f4c84b;--green:#77d970;--sidebar:210px;--head:150px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(135deg,var(--bg),#111936 55%,var(--bg2));min-height:100vh}
button,input,select{font:inherit}
header{position:fixed;top:0;left:0;right:0;z-index:30;padding:14px 18px;background:rgba(8,11,22,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:transform .25s}
header.hide{transform:translateY(-105%)}h1{margin:0 0 9px;font-size:20px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.btn,.search,.select{border:1px solid var(--line);background:#1b2440;color:var(--text);border-radius:11px;padding:9px 12px}.btn{cursor:pointer;font-weight:750}.btn.active{background:linear-gradient(135deg,#8d6b00,#d8a600);color:#111;border-color:#e0b124}.search{min-width:210px;background:#0d1326}.stat{color:var(--muted);font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:999px}
.sidebar{position:fixed;z-index:20;left:0;top:var(--head);bottom:0;width:var(--sidebar);padding:14px 10px 30px;background:rgba(13,19,38,.96);border-right:1px solid var(--line);overflow:auto;transition:top .25s,transform .25s}header.hide + .sidebar{top:0}
.side-title{font-size:12px;color:var(--muted);padding:3px 9px 10px}.set-btn{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid transparent;color:var(--text);background:transparent;border-radius:11px;padding:9px 10px;margin-bottom:4px;cursor:pointer;text-align:left}.set-btn span{font-size:12px;color:var(--muted)}.set-btn:hover{background:#18213b}.set-btn.active{background:#283253;border-color:#58658e}
main{margin-left:var(--sidebar);padding:calc(var(--head) + 20px) 18px 70px;transition:padding-top .25s}header.hide ~ main{padding-top:20px}
.binder{max-width:1120px;margin:auto;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.page-title{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin:0 3px 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.14);border-radius:17px;padding:10px;overflow:hidden}.card.owned{border-color:rgba(119,217,112,.78);box-shadow:0 0 0 1px rgba(119,217,112,.2),0 0 22px rgba(119,217,112,.08)}
.set-banner{display:flex;justify-content:space-between;gap:8px;margin:-10px -10px 10px;padding:9px 12px;background:linear-gradient(135deg,#f4c84b,#d99c00);color:#171006;font-weight:950;font-size:14px}.set-banner.promo{background:linear-gradient(135deg,#8f54c7,#503188);color:#fff}.set-banner small{font-size:10px;font-weight:800;text-align:right}
.card img,.placeholder{width:100%;aspect-ratio:5/7;object-fit:contain;border-radius:11px;background:#090d19;border:1px solid rgba(255,255,255,.08)}.card img{cursor:zoom-in}.card:not(.owned) img{filter:grayscale(1);opacity:.28}.card:not(.owned)::after{content:"未入手";position:absolute;top:54px;right:-31px;rotate:35deg;background:#555;color:#fff;padding:6px 35px;font-size:11px;font-weight:900}
.badges{position:absolute;z-index:2;top:54px;left:13px;display:flex;gap:5px}.badge{background:rgba(9,13,25,.9);border:1px solid #596381;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.badge.iconic{background:linear-gradient(135deg,#533077,#176480);border-color:#9be1ff}.owned-count{background:var(--green);color:#071108;border:0}
.name{font-size:14px;font-weight:900;margin:9px 1px 4px;line-height:1.32;min-height:38px}.meta{font-size:11px;color:var(--muted);margin-bottom:8px}.fields{display:grid;grid-template-columns:1fr 78px;gap:7px}.field{display:flex;gap:5px;align-items:center;background:#0d1326;border:1px solid var(--line);border-radius:9px;padding:6px 8px}.field label{font-size:10px;color:var(--muted)}.field input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:80px 10px}.top{position:fixed;z-index:35;right:17px;bottom:17px;background:#8d6b00;color:#fff;border:0;border-radius:999px;padding:12px 15px;cursor:pointer}
.image-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:18px}.image-modal.open{display:flex}.image-modal img{max-width:min(92vw,680px);max-height:92vh;object-fit:contain;border-radius:16px}.image-modal button{position:absolute;top:15px;right:15px;border:0;border-radius:999px;background:#fff;width:42px;height:42px;font-size:23px}.mobile-set{display:none}
@media(max-width:760px){:root{--sidebar:0px;--head:200px}header{padding:11px 10px}h1{font-size:16px}.toolbar{gap:6px}.btn,.search,.select{padding:8px 9px;font-size:12px}.search{width:100%;min-width:0}.mobile-set{display:inline-block}.sidebar{width:230px;top:0;padding-top:72px;transform:translateX(-105%)}.sidebar.open{transform:translateX(0)}main{margin-left:0;padding-left:8px;padding-right:8px}.binder{padding:9px;border-radius:17px}.grid{gap:8px}.card{padding:7px;border-radius:12px}.set-banner{margin:-7px -7px 7px;padding:7px 8px;font-size:12px}.badges{top:43px;left:10px}.name{font-size:11px;min-height:43px}.meta{font-size:9px}.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="header"><h1>ロルカナ 高レアリティバインダー</h1><div class="toolbar">
<button class="btn mobile-set" id="mobileSet">弾を選ぶ</button>
<button class="btn active own-filter" data-own="all">全部</button><button class="btn own-filter" data-own="owned">所持のみ</button><button class="btn own-filter" data-own="missing">未所持のみ</button>
<button class="btn active rarity-filter" data-rarity="all">全種類</button><button class="btn rarity-filter" data-rarity="エンチャンテッド">エンチャンテッド</button><button class="btn rarity-filter" data-rarity="アイコニック">アイコニック</button><button class="btn rarity-filter" data-rarity="プロモ">プロモ</button>
<select class="select" id="sort"><option value="set">弾・番号順</option><option value="price">価格が高い順</option><option value="owned">所持枚数順</option></select>
<input class="search" id="search" placeholder="カード名検索"><span class="stat" id="stats"></span>
<button class="btn" id="exportBtn">データ保存</button><button class="btn" id="importBtn">データ読込</button><input type="file" id="fileInput" accept=".json" hidden>
</div></header>
<aside class="sidebar" id="sidebar"><div class="side-title">カテゴリ</div><button class="set-btn active" data-set="all"><b>全カード</b><span>すべて表示</span></button><button class="set-btn" data-set="promo"><b>プロモカード</b><span>プロモのみ</span></button><div class="side-title">弾を選択</div><div id="setButtons"></div></aside>
<main><section class="binder"><div class="page-title"><span id="resultTitle"></span><span>3列バインダー表示</span></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>対象カードがありません</div></section></main>
<button class="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑ 上へ</button>
<div class="image-modal" id="imageModal"><button id="modalClose">×</button><img id="modalImage"></div>
<script>
const KEY='lorcana_collection_light_v1';
let cards=[],setNames={},state={set:'all',own:'all',rarity:'all',sort:'set',q:''};
const $=id=>document.getElementById(id),grid=$('grid'),sidebar=$('sidebar'),header=$('header');
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function loadSave(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function persist(){const o={};cards.forEach(c=>o[c.id]={owned:Number(c.owned)||0,price:Number(c.price)||0});localStorage.setItem(KEY,JSON.stringify(o))}
function applySave(o){cards=cards.map(c=>o[c.id]?{...c,owned:Number(o[c.id].owned)||0,price:Number(o[c.id].price)||0}:c)}
function sets(){ $('setButtons').innerHTML=Object.entries(setNames).map(([n,name])=>`<button class="set-btn" data-set="${n}"><b>第${n}弾</b><span>${esc(name)}</span></button>`).join('');document.querySelectorAll('.set-btn').forEach(b=>b.onclick=()=>{state.set=b.dataset.set;document.querySelectorAll('.set-btn').forEach(x=>x.classList.toggle('active',x===b));render();if(innerWidth<761)sidebar.classList.remove('open')})}
function filtered(){let a=cards.filter(c=>{if(state.set==='promo'&&c.category!=='プロモ')return false;if(!['all','promo'].includes(state.set)&&String(c.setNumber)!==state.set)return false;if(state.own==='owned'&&!(c.owned>0))return false;if(state.own==='missing'&&c.owned>0)return false;if(state.rarity!=='all'&&c.category!==state.rarity)return false;if(state.q&&!(`${c.name} ${c.setShort||''}`.toLowerCase().includes(state.q)))return false;return true});a.sort((x,y)=>state.sort==='price'?(y.price||0)-(x.price||0):state.sort==='owned'?(y.owned||0)-(x.owned||0):(Number(x.setNumber||999)-Number(y.setNumber||999)||Number(x.sortNumber||x.number||0)-Number(y.sortNumber||y.number||0)));return a}
function render(){const a=filtered();$('empty').hidden=!!a.length;grid.innerHTML=a.map(c=>`<article class="card ${c.owned>0?'owned':''}" data-id="${encodeURIComponent(c.id)}"><div class="set-banner ${c.category==='プロモ'?'promo':''}"><span>${c.category==='プロモ'?'プロモ':`第${c.setNumber}弾`}</span><small>${esc(c.category==='プロモ'?'PROMO CARD':c.setShort||'')}</small></div><div class="badges"><span class="badge ${c.category==='アイコニック'?'iconic':''}">${esc(c.category)}</span>${c.owned>0?`<span class="badge owned-count">${c.owned}枚</span>`:''}</div>${c.image?`<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}">`:`<div class="placeholder">画像未設定</div>`}<div class="name">${esc(c.name)}</div><div class="meta">${c.category==='プロモ'?'プロモカード':`第${c.setNumber}弾 / No.${esc(c.number)}`}</div><div class="fields"><div class="field"><label>価格</label><input type="number" min="0" data-k="price" value="${c.price||0}"></div><div class="field"><label>枚数</label><input type="number" min="0" data-k="owned" value="${c.owned||0}"></div></div></article>`).join('');
grid.querySelectorAll('input').forEach(i=>i.onchange=e=>{const c=cards.find(x=>x.id===decodeURIComponent(e.target.closest('.card').dataset.id));c[e.target.dataset.k]=Math.max(0,Number(e.target.value)||0);persist();render()});
grid.querySelectorAll('img').forEach(img=>img.onclick=()=>{$('modalImage').src=img.src;$('imageModal').classList.add('open')});
const own=cards.filter(c=>c.owned>0).length,count=cards.reduce((s,c)=>s+(c.owned||0),0),total=cards.reduce((s,c)=>s+(c.price||0)*(c.owned||0),0),pct=cards.length?Math.round(own/cards.length*100):0;$('stats').textContent=`所持 ${own}/${cards.length}種（${pct}%）・${count}枚・${total.toLocaleString()}円`;
$('resultTitle').textContent=state.set==='all'?`全カード：${a.length}種`:state.set==='promo'?`プロモカード：${a.length}種`:`第${state.set}弾 ${setNames[state.set]}：${a.length}種`}
async function init(){try{const r=await fetch('cards.json',{cache:'no-store'});if(!r.ok)throw new Error('cards.jsonを読み込めません');const data=await r.json();cards=data.cards;setNames=data.setNames;applySave(loadSave());sets();render()}catch(e){grid.innerHTML=`<div class="empty">読み込みエラー：${esc(e.message)}<br>GitHub Pages上で開くか、ローカルサーバーを使ってください。</div>`}}
document.querySelectorAll('.own-filter').forEach(b=>b.onclick=()=>{state.own=b.dataset.own;document.querySelectorAll('.own-filter').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('.rarity-filter').forEach(b=>b.onclick=()=>{state.rarity=b.dataset.rarity;document.querySelectorAll('.rarity-filter').forEach(x=>x.classList.toggle('active',x===b));render()});
$('sort').onchange=e=>{state.sort=e.target.value;render()};$('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};$('mobileSet').onclick=()=>sidebar.classList.toggle('open');
$('exportBtn').onclick=()=>{persist();const blob=new Blob([localStorage.getItem(KEY)||'{}'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lorcana_collection_save.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());applySave(o);persist();render()}catch{alert('保存データを読み込めませんでした')}e.target.value=''};
$('modalClose').onclick=()=>$('imageModal').classList.remove('open');$('imageModal').onclick=e=>{if(e.target===$('imageModal'))$('imageModal').classList.remove('open')};
let last=scrollY;addEventListener('scroll',()=>{const y=scrollY;if(y>100&&y>last+3)header.classList.add('hide');else if(y<last-3||y<30)header.classList.remove('hide');last=y},{passive:true});init();
</script></body></html>
